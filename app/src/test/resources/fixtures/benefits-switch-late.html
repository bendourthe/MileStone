<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rewards</title></head>
<body>
<header><div data-testid="context_switcher_container">
  <button type="button" data-testid="simple_switcher_combobox" role="combobox" aria-expanded="false" onclick="toggleList(this)">
    <div data-testid="simple_switcher_selected_option_display">
      <span data-testid="simple_switcher_display_name" id="selected-name">Fixture Platinum Card</span>
      <span data-testid="simple_switcher_display_number"><span data-testid="simple_switcher_display_number_val" id="selected-digits">71008</span></span>
    </div>
  </button>
  <div id="list"></div>
</div>
<script>
  // Synthetic stand-in for an in-place card switch: the address changes without a new document, the switcher
  // shows the new card at once, the tracker area empties, and the new card's trackers render 7 s later.
  function toggleList(box) {
    var list = document.getElementById('list');
    if (list.firstChild) { list.innerHTML = ''; box.setAttribute('aria-expanded', 'false'); return; }
    box.setAttribute('aria-expanded', 'true');
    list.innerHTML =
      '<ul data-testid="simple_switcher_listbox" role="listbox">' +
      '<li role="option" data-testid="simple_switcher_static_option_ALL"><span data-testid="simple_switcher_display_name">All accounts</span></li>' +
      '<li role="option" data-testid="simple_switcher_product_option_FIXTURE_A">' +
      '<span data-testid="simple_switcher_display_name">Fixture Platinum Card</span>' +
      '<span data-testid="simple_switcher_display_number_val">71008</span></li>' +
      '<li role="option" data-testid="simple_switcher_product_option_FIXTURE_B" onclick="switchLate()">' +
      '<span data-testid="simple_switcher_display_name">Fixture Hotel Card</span>' +
      '<span data-testid="simple_switcher_display_number_val">42005</span></li></ul>';
  }

  function tracker(name, title, spent, word, remaining, max) {
    return '<div data-testid="container-' + name + '" role="group">' +
      '<h3 data-testid="heading-' + name + '"><span>' + title + '</span></h3>' +
      '<div data-testid="progress-section-' + name + '"><progress value="0" max="' + max + '"></progress>' +
      '<div data-testid="tracker-spent-section"><span data-testid="tracker-spent-amount">' + spent + '</span><span>' + word + '</span></div>' +
      '<div data-testid="tracker-remaining-section"><span>' + remaining + '</span></div></div></div>';
  }

  function switchLate() {
    document.getElementById('list').innerHTML = '';
    history.pushState({}, '', 'benefits-switch-late.html?card=next');
    document.getElementById('selected-name').textContent = 'Fixture Hotel Card';
    document.getElementById('selected-digits').textContent = '42005';
    document.getElementById('grid').innerHTML = '';
    setTimeout(function () {
      document.getElementById('grid').innerHTML =
        tracker('Fixture-Hotel-Credit', '$50 Fixture Hotel Credit', '$0', 'earned', '$50 to go', 50) +
        tracker('Fixture-Night-Bonus', 'Fixture Free Night Bonus', '$2,000', 'spent', '$13,000 to go', 15000);
    }, 7000);
  }
</script>
</header>
<main>
<h2>Track Your Progress</h2>
<div data-testid="tracker-grid-component" id="grid">
  <div data-testid="container-Fixture-Dining-Credit" role="group">
  <h3 data-testid="heading-Fixture-Dining-Credit"><span>$25 Fixture Dining Credit</span></h3>
  <div data-testid="progress-section-Fixture-Dining-Credit"><progress value="5" max="25"></progress>
    <div data-testid="tracker-spent-section"><span data-testid="tracker-spent-amount">$5</span><span>earned</span></div>
    <div data-testid="tracker-remaining-section"><span>$20 to go</span></div></div>
</div>
  <div data-testid="container-Fixture-Travel-Credit" role="group">
  <h3 data-testid="heading-Fixture-Travel-Credit"><span>$40 Fixture Travel Credit</span></h3>
  <div data-testid="progress-section-Fixture-Travel-Credit"><progress value="0" max="40"></progress>
    <div data-testid="tracker-spent-section"><span data-testid="tracker-spent-amount">$0</span><span>earned</span></div>
    <div data-testid="tracker-remaining-section"><span>$40 to go</span></div></div>
</div>
</div>
<a href="benefits-view-all.html?account_key=decoyvalue">View all benefits</a>
</main>
</body></html>
