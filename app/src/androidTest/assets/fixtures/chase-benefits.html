<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Synthetic Chase-shaped benefits</title>
</head>
<body>
<div id="app"></div>
<script>
// Synthetic, Chase-shaped single-page app (ADR-0009 structure). No real names, amounts, or identifiers.
// The test serves this page with __VARIANT__ replaced by "two", "three", "nomore", "pay", "verify", "reload", "overflow", "batch", "sheet", or "groups".
(function () {
  var variant = '__VARIANT__';
  var cards = [
    { id: 'ctl-alpha', name: 'Synthetic Reserve', digits: '1111', groups: [
      { title: 'Maximize credits', rows: [
        { title: 'Synthetic travel credit', tag: 'activated', value: '$300 annual' },
        { title: 'Synthetic dining credit', tag: null, value: '$10 monthly' } ] },
      { title: 'Membership perks', rows: [
        { title: 'Synthetic lounge access', tag: 'redeemed', value: null } ] } ],
      tracker: { value: 1500, max: 4000, text: 'Spend $1,500 of $4,000 toward the welcome bonus' } },
    { id: 'ctl-beta', name: 'Synthetic Freedom', digits: '2222', groups: [
      { title: 'Boost points', rows: [ { title: 'Synthetic bonus category', tag: null, value: '5x points' } ] } ] }
  ];
  if (variant === 'gauge') {
    // Chase's own gauge: the fill as a percentage, both amounts only in the accessible text, the target in the text.
    cards[0].tracker = { percentage: 37, label: 'Gauge chart: $1,500 received of $4,000',
      text: 'Spend $4,000 by Dec 31, 2026 to get the welcome bonus' };
    cards[0].tracker.heading = 'Synthetic unlock';
    // Chase's value block: the amount and its note as separate lines.
    cards[0].groups[0].rows[1].value = ['$10', 'Up to $5 per transaction'];
  }
  if (variant === 'three' || variant === 'groups') {
    cards.push({ id: 'ctl-gamma', name: 'Synthetic Ink', digits: '3333', groups: [
      { title: 'Business perks', rows: [ { title: 'Synthetic shipping credit', tag: 'activated', value: '$25 quarterly' } ] } ] });
  }
  if (variant === 'credits') {
    // Credits whose use shows only on each credit's own page.
    cards[0].groups[0].id = 'MaximizeStatementCredits';
    cards[0].groups[0].rows[0].used = { text: '$120/$300', percentage: 40 };
    cards[0].groups[0].rows[1].used = { text: '$0/$10', percentage: 0 };
  }
  if (variant === 'overflow') {
    // One more row than the script may post for a card.
    cards[1].groups[0].rows = [];
    for (var n = 1; n <= 151; n++) cards[1].groups[0].rows.push({ title: 'Synthetic row ' + n, tag: null, value: null });
  }
  if (variant === 'reload') {
    // More cards than any captured account, and every card switch is a full page load.
    for (var extra = 3; extra <= 10; extra++) {
      cards.push({ id: 'ctl-extra-' + extra, name: 'Synthetic Card ' + extra, digits: String(1000 + extra), groups: [
        { title: 'Card perks', rows: [ { title: 'Synthetic perk ' + extra, tag: null, value: null } ] } ] });
    }
  }
  var selected = Number(new URLSearchParams(location.search).get('sel') || 0);
  var sheetOpen = false;
  // "batch": the first time the sheet opens it lists one card, and the rest 1.2 s later.
  var batching = variant === 'batch';
  var menuOpen = false;
  var busy = false;
  var app = document.getElementById('app');

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'text') node.textContent = attrs[key];
      else if (key === 'onclick') node.addEventListener('click', attrs[key]);
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  // A component whose own text is empty and whose click handler sits on the button inside its shadow root.
  function component(tag, attrs, onPress) {
    var host = el(tag, attrs);
    var inner = document.createElement('button');
    inner.textContent = attrs.text || attrs.label;
    inner.addEventListener('click', onPress);
    host.attachShadow({ mode: 'open' }).appendChild(inner);
    return host;
  }

  function go(route) {
    history.pushState({}, '', location.pathname + '#' + route);
    render();
  }

  function route() { return (location.hash || '#/dashboard').slice(1); }

  function label(card) { return card.name + ' (...' + card.digits + ')'; }

  function benefitsPage() {
    var card = cards[selected];
    var groups = card.groups.map(function (group, index) {
      var rows = group.rows.map(function (row, rowIndex) {
        return el('div', { role: 'listitem' }, [ el('li', { 'class': 'nonFeaturedListItem-listItem', role: 'link', onclick: function () { if (row.used) go('/credit/' + index + '-' + rowIndex); } }, [
          el('div', { 'class': 'nonFeaturedListItem-container' }, [
            el('div', { 'class': 'nfli-text' }, [ el('p', { text: row.title }), row.tag ? el('p', { 'class': 'nfli-text-tag', text: row.tag }) : null ]),
            row.value ? el('div', { 'class': 'nfli-value', 'data-testid': 'value' }, [].concat(row.value).map(function (part) {
              return el('p', { text: part }); })) : null ]) ]) ]);
      });
      return el('div', {}, [ el('h2', { 'class': 'non-featured-benefit-title', text: group.title }),
        el('div', { 'class': 'nonFeaturedBenefit' }, [ el('ul', { 'data-testid': 'nonFeaturedBenefits-' + (group.id || 'G' + index), role: 'list' }, rows) ]) ]);
    });
    var tracker = card.tracker ? el('a', { href: '#/benefits' }, [ card.tracker.heading ? el('div', { role: 'heading' }, [
      el('span', {}, [ el('span', { text: card.tracker.heading }), el('span', { text: card.tracker.heading }) ]) ]) : null, el('div', {}, [
      el('mds-progress-bar', card.tracker.label
        ? { 'accessible-text': card.tracker.label, 'progress-percentage': String(card.tracker.percentage), 'role-name': 'progress bar' }
        : { value: String(card.tracker.value), max: String(card.tracker.max) }), el('span', { text: card.tracker.text }) ]) ]) : null;
    var listed = batching ? cards.slice(0, 1) : cards;
    var sheet = sheetOpen ? el('div', { 'data-testid': 'card-selector-sheet', role: 'dialog' }, [ el('div', {}, [ el('ul', {}, listed.map(function (option, index) {
      var radio = el('input', { type: 'radio', id: option.id });
      radio.checked = index === selected;
      return el('li', { 'data-selected': String(index === selected) }, [ el('label', { onclick: function (event) {
        event.preventDefault();
        sheetOpen = false;
        if (index !== selected && variant === 'reload') {
          location.replace(location.pathname + '?sel=' + index + '#/benefits');
          return;
        }
        if (index !== selected) {
          selected = index;
          busy = true;
          setTimeout(function () { busy = false; render(); }, 300);
        }
        render();
      } }, [ radio, el('span', { text: label(option) }) ]) ]);
    })) ]) ]) : null;
    return el('div', { 'data-testid': 'benefits-hub-page', 'aria-busy': busy ? 'true' : 'false' }, [
      el('a', { 'data-testid': 'card-selector-button', role: 'button', href: '#/benefits', text: label(card), onclick: function (event) {
        event.preventDefault(); sheetOpen = !sheetOpen;
        if (sheetOpen && batching) setTimeout(function () { batching = false; render(); }, 1200);
        render(); } }),
      sheet,
      busy ? null : tracker
    ].concat(busy ? [] : groups));
  }

  function render() {
    var path = route();
    app.innerHTML = '';
    if (path === '/dashboard' && variant === 'verify') {
      // An identity check offering where to send a code: the read must never choose one.
      app.appendChild(el('fieldset', {}, ['Text ...1234', 'Call ...1234'].map(function (text, index) {
        var radio = el('input', { type: 'radio', id: 'deliver-' + index });
        radio.addEventListener('click', function () { document.title = 'forbidden-click'; });
        return el('label', {}, [ radio, el('span', { text: text }) ]);
      })));
      app.appendChild(el('button', { text: 'Synthetic Reserve (...1111)', onclick: function () { document.title = 'forbidden-click'; } }));
      return;
    }
    if (path === '/dashboard' && variant === 'groups') {
      // Chase-shaped home page groups: business cards under the business's name, personal cards under "PERSONAL".
      var group = function (heading, members) {
        app.appendChild(el('div', { 'data-testid': 'account-accordion-subdivision' }, [ el('span', { text: heading }) ]));
        members.forEach(function (card) { app.appendChild(el('button', { text: label(card), onclick: function () { go('/account'); } })); });
      };
      group('SYNTHETIC LLC', [cards[2]]);
      group('PERSONAL', [cards[0], cards[1]]);
      return;
    }
    if (path === '/dashboard') {
      if (variant === 'pay') {
        app.appendChild(el('button', { text: 'Pay from TOTAL CHECKING (...9999)', onclick: function () { document.title = 'forbidden-click'; go('/pay'); } }));
      }
      cards.forEach(function (card) {
        app.appendChild(el('button', { text: label(card), onclick: function () { go('/account'); } }));
      });
    } else if (path === '/account' && variant === 'sheet') {
      // Chase-shaped components (2026-11-15 captures): many controls ahead of the menu, a More button and a list item
      // labelled only through attributes, each reacting to its inner shadow button, and a bottom sheet opened in place.
      for (var link = 1; link <= 90; link++) app.appendChild(el('a', { href: '#/account', text: 'Synthetic link ' + link }));
      app.appendChild(component('mds-button', { text: 'More' }, function () { menuOpen = true; render(); }));
      var bottom = el('mds-bottom-sheet', { 'header-text': 'More', open: String(menuOpen), style: menuOpen ? 'display:block' : 'display:none' });
      var item = component('mds-list-item', { label: 'Card benefits' }, function () { menuOpen = false; go('/benefits'); });
      // Its own text adds a description line, so only the label attribute reads exactly "Card benefits".
      item.appendChild(el('span', { text: 'Card benefits' }));
      item.appendChild(el('span', { text: 'Credits, perks, and protections' }));
      bottom.appendChild(item);
      app.appendChild(bottom);
    } else if (path === '/account') {
      if (variant !== 'nomore') app.appendChild(el('button', { text: 'More', onclick: function () { menuOpen = true; render(); } }));
      if (menuOpen) app.appendChild(el('div', { role: 'menu' }, [ el('button', { role: 'menuitem', text: 'Benefits', onclick: function () { menuOpen = false; go('/benefits'); } }) ]));
    } else if (path.indexOf('/credit/') === 0) {
      // A credit's own page (2026-11-21 captures): a status tile whose gauge shows the amount used beside it.
      var at = path.slice(8).split('-').map(Number);
      var used = cards[selected].groups[at[0]].rows[at[1]].used;
      app.appendChild(el('div', { 'data-testid': 'benefit-status-tile' }, [ el('p', { text: 'Synthetic credit terms' }),
        el('div', { 'data-testid': 'benefit-status-tracker-container' }, [ el('div', {}, [
          el('mds-progress-bar', { 'accessible-text': '', 'progress-percentage': String(used.percentage) }), el('span', { text: used.text }) ]) ]),
        el('div', {}, [ el('div', { 'data-testid': 'iconFooterTitle', text: used.status || '' }) ]),
        el('button', { text: 'Explore travel', onclick: function () { document.title = 'forbidden-click'; } }) ]));
    } else if (path === '/benefits') {
      app.appendChild(benefitsPage());
    }
  }

  // Going back from a credit's page shows the list again, as Chase's router does.
  window.addEventListener('popstate', render);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && sheetOpen) { sheetOpen = false; render(); }
  });
  render();
})();
</script>
</body>
</html>
