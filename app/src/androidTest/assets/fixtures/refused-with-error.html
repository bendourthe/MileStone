<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic sign-in that refuses the password</title></head>
<body>
<form id="signin">
  <label>Username <input type="text" name="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password"></label>
  <p role="alert" id="error"></p>
  <button type="submit">Sign In</button>
</form>
<script>
  // The first press is refused with an error while the password stays typed; a second press would sign in, so a
  // session that presses again after a shown error reads a balance instead of stopping.
  var presses = 0;
  var form = document.getElementById('signin');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (++presses === 1) {
      document.getElementById('error').textContent = 'That password is not right.';
      return;
    }
    document.body.innerHTML = '<span class="points-balance">9,876</span>';
  });
</script>
</body>
</html>
