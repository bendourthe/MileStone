<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic emailed-link sign-in with a password route</title></head>
<body>
<form id="step">
  <label>Email <input type="email" name="email" autocomplete="email"></label>
  <button type="submit">Sign In</button>
</form>
<div class="route"><span id="route">Sign in with password</span></div>
<script>
  // Sign In on the email step sends an emailed link, which locks the page; only the password route reaches a balance.
  var locked = false;
  var form = document.getElementById('step');
  form.addEventListener('submit', function (event) { event.preventDefault(); locked = true; });
  document.getElementById('route').addEventListener('click', function () {
    if (locked) return;
    document.querySelector('.route').remove();
    var page = document.createElement('form');
    page.innerHTML = '<label>Email <input type="email" name="email" autocomplete="email"></label>' +
      '<label>Password <input type="password" name="password"></label>' +
      '<label>Last name <input type="text" name="lastName" autocomplete="family-name"></label>' +
      '<button type="submit">Sign In</button>';
    form.replaceWith(page);
    page.addEventListener('submit', function (event) {
      event.preventDefault();
      var value = function (name) { return page.querySelector('input[name="' + name + '"]').value; };
      if (!value('email') || !value('password') || !value('lastName')) return;
      document.body.innerHTML = '<span class="points-balance">9,876</span>';
    });
  });
</script>
</body>
</html>
