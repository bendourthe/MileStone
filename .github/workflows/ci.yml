name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Repository validation
    if: ${{ github.base_ref == 'develop' || github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Prepare validation dependencies
        run: |
          python3.12 -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-validation.txt
          .validation-venv/bin/python -m playwright install --with-deps chromium
          docker pull zricethezav/gitleaks@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176

      # ADR-0001: capture builds stay local. The native full profile names this scope explicitly.
      # Runtime uses the same emulator-bound native platform profile before merge.
      - name: Validate the integration candidate
        run: .validation-venv/bin/python scripts/validate.py --profile full --platform ci-linux --quiet

      - name: Prepare the isolated Android emulator
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/milestone-ci-avd
        run: |
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p reports/metadata "$ANDROID_AVD_HOME"
          sdkmanager --install emulator "system-images;android-36;google_apis;x86_64" > reports/emulator-sdk.log 2>&1
          printf 'no\n' | avdmanager create avd -n milestone-ci -k "system-images;android-36;google_apis;x86_64" --device pixel_5 > reports/emulator-avd.log 2>&1
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check > reports/metadata/emulator-acceleration.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -no-window -version > reports/metadata/emulator-version.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd milestone-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > reports/emulator.log 2>&1 &
          emulator_pid=$!
          timeout 180 adb -s emulator-5554 wait-for-device
          for _ in $(seq 1 90); do
            kill -0 "$emulator_pid"
            booted=$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')
            if [ "$booted" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb -s emulator-5554 shell input keyevent 82

      - name: Validate Android runtime before merge
        env:
          ANDROID_SERIAL: emulator-5554
        run: .validation-venv/bin/python scripts/validate.py --profile platform --platform ci-linux --quiet

      - name: Stop the assigned emulator
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          if [ "$(adb -s emulator-5554 shell getprop ro.kernel.qemu 2>/dev/null | tr -d '\r')" = "1" ]; then
            adb -s emulator-5554 emu kill
          fi

      - name: Aggregate validation evidence
        if: ${{ always() }}
        run: |
          result=0
          python3.12 scripts/validate.py --profile report --platform ci-linux --quiet || result=$?
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Upload validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn

  ci:
    name: CI result
    if: ${{ always() }}
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected validation jobs to succeed
        env:
          RESULT: ${{ needs.android.result }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "develop" ] || [ "$BASE" = "main" ]; then
            test "$RESULT" = "success"
          else
            case "$RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
